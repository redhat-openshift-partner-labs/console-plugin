name: Lint card page E2E test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-card-page:
    name: Lint card-page.spec.ts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.18.0.cjs install --immutable
      - name: Lint card-page.spec.ts
        run: node .yarn/releases/yarn-4.18.0.cjs exec eslint integration-tests/tests/card-page.spec.ts --max-warnings 0
