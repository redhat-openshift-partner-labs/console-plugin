name: Lint card page E2E test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-card-page:
    name: Lint card-page.spec.ts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.18.0.cjs install --immutable
      - name: Lint card-page.spec.ts
        run: node .yarn/releases/yarn-4.18.0.cjs exec eslint integration-tests/tests/card-page.spec.ts --max-warnings 0
