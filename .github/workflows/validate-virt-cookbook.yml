name: Validate virt-cookbook

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virt-cookbook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate virt-cookbook quickstarts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v4.2.4
      - name: Install dependencies
        run: node .yarn/releases/yarn-4.18.0.cjs install --immutable
      - name: Check validator types and lint
        run: |
          node .yarn/releases/yarn-4.18.0.cjs exec tsc --project scripts/tsconfig.json
          node .yarn/releases/yarn-4.18.0.cjs exec eslint scripts --max-warnings 0
      - name: Validate QuickStarts
        run: node .yarn/releases/yarn-4.18.0.cjs validate:quickstarts
      - name: Run unit tests
        run: node .yarn/releases/yarn-4.18.0.cjs test --ci --runInBand
