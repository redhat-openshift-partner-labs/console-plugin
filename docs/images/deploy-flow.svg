<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1262 980" width="1262" height="980" role="img" aria-labelledby="title desc">
  <title id="title">Deploy flow</title>
  <desc id="desc">A developer runs make release IMAGE=i, or make deploy-pr PR=n IMAGE_REGISTRY=r, which first runs gh pr checkout (make checkout-pr PR=n, requires a clean working tree). The container build uses podman by default with --platform linux/amd64. The container push needs the engine logged in to the registry and sends the image to the image registry (IMAGE=registry/name:tag; deploy-pr uses pr-N-quickstart:latest). helm upgrade --install runs with --take-ownership and --set-string plugin.image. In the OpenShift cluster, in one namespace, the chart creates: the ConsolePlugin, whose backend is the Service on port 9443 and whose name is fixed and cluster scoped; a Job that runs as a post-install and post-upgrade hook and patches consoles.operator.openshift.io cluster spec.plugins with the plugin name; ConsoleQuickStart resources, one per enabled values entry, controlled by quickStarts.name.enabled, cluster scoped; and a Deployment and Service where nginx serves dist/ over TLS on port 9443 with the serving certificate from the Service annotation. The Deployment pulls the image from the registry. The OpenShift Console loads the plugin from the Service once the Job enables it. The namespace and release name are console-demos-ocp-virtualization by default; NAMESPACE and RELEASE override them. Constraints: deploy-pr requires a clean working tree and leaves the tree on the PR branch; the deploy-pr image name is IMAGE_REGISTRY/pr-N-quickstart:latest; Helm 3.17 or newer is required for --take-ownership; the container engine must be logged in to the registry; ConsolePlugin has a fixed cluster-scoped name, so a second release cannot adopt it.</desc>

  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .frame { fill: #f6f8fa; stroke: #d0d7de; }
    .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { fill: #59636e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .c { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 24px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 650; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .b { font-size: 12px; }
    .s { font-size: 11px; }
    .k { font-weight: 650; }

    .src  { fill: #e6f6f4; stroke: #1f8f84; }
    .gate { fill: #fff4e0; stroke: #c27c0e; }
    .core { fill: #ecf2ff; stroke: #3b6fd8; }
    .out  { fill: #f3ecff; stroke: #7a4fd6; }
    .store{ fill: #eaf7ec; stroke: #2e8b46; }
    .deny { fill: #fdecec; stroke: #d1242f; }
    .user { fill: #f6f8fa; stroke: #6e7781; }

    /* badge fills are darker than card strokes so the white digit reaches 4.5:1 */
    .badge-src  { fill: #1c8278; }
    .badge-gate { fill: #a3680c; }
    .badge-core { fill: #3b6fd8; }
    .badge-out  { fill: #7a4fd6; }
    .badge-store{ fill: #2c8543; }
    .badge-t    { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }

    .flow  { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .ctl   { stroke: #6e7781; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .link  { stroke: #6e7781; stroke-width: 1.6; fill: none; }
    .rule  { stroke: #d0d7de; stroke-width: 1; }
    .ah-flow { fill: #57606a; }
    .ah-ctl  { fill: #6e7781; }
    .x { stroke: #d1242f; stroke-width: 2; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .frame { fill: #151b23; stroke: #30363d; }
      .t, .c { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .src  { fill: #0f2a28; stroke: #3fb8a9; }
      .gate { fill: #2e2310; stroke: #e3a33b; }
      .core { fill: #14213d; stroke: #6d9bff; }
      .out  { fill: #251a40; stroke: #a888ff; }
      .store{ fill: #112a19; stroke: #4cc06a; }
      .deny { fill: #3a1417; stroke: #ff6b6b; }
      .user { fill: #161b22; stroke: #6e7681; }
      .badge-src  { fill: #3fb8a9; }
      .badge-gate { fill: #e3a33b; }
      .badge-core { fill: #6d9bff; }
      .badge-out  { fill: #a888ff; }
      .badge-store{ fill: #4cc06a; }
      .badge-t    { fill: #0d1117; }
      .flow  { stroke: #8b949e; }
      .ctl   { stroke: #768390; }
      .link  { stroke: #768390; }
      .rule  { stroke: #30363d; }
      .ah-flow { fill: #8b949e; }
      .ah-ctl  { fill: #768390; }
      .x { stroke: #ff6b6b; }
    }
  </style>

  <defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-flow" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ctl" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Canvas -->
  <rect class="bg" x="0.5" y="0.5" width="1261" height="979" rx="16"/>

  <!-- Title -->
  <text class="t h1" x="40" y="46">Deploy flow</text>
  <text class="m b" x="40" y="68">make release builds, pushes, and upgrades the Helm release; make deploy-pr checks out a pull request first.</text>

  <!-- ===== Constraints band ===== -->
  <text class="m lbl" x="40" y="90">CONSTRAINTS</text>
  <rect class="frame" x="40" y="98" width="1182" height="188" rx="12"/>
  <text class="t b k" x="56" y="128">deploy-pr</text>
  <text class="m b" x="230" y="128">requires a clean working tree and leaves the tree on the PR branch</text>
  <line class="rule" x1="56" y1="142" x2="1206" y2="142"/>
  <text class="t b k" x="56" y="160">Image name</text>
  <text class="m b" x="230" y="160">deploy-pr pushes IMAGE_REGISTRY/pr-N-quickstart:latest; set IMAGE to override it</text>
  <line class="rule" x1="56" y1="174" x2="1206" y2="174"/>
  <text class="t b k" x="56" y="192">Helm</text>
  <text class="m b" x="230" y="192">3.17 or newer is required for --take-ownership</text>
  <line class="rule" x1="56" y1="206" x2="1206" y2="206"/>
  <text class="t b k" x="56" y="224">Registry</text>
  <text class="m b" x="230" y="224">the container engine must be logged in to the registry, and the cluster must be able to pull the image</text>
  <line class="rule" x1="56" y1="238" x2="1206" y2="238"/>
  <text class="t b k" x="56" y="256">ConsolePlugin</text>
  <text class="m b" x="230" y="256">has a fixed cluster-scoped name, so a second release cannot adopt it</text>

  <!-- ===== Build and push ===== -->
  <text class="m lbl" x="40" y="318">BUILD · PUSH · DEPLOY</text>

  <!-- Developer -->
  <rect class="user" x="40" y="369" width="180" height="64" rx="12"/>
  <circle class="m" cx="64" cy="393" r="7"/>
  <path class="m" d="M52 414 q12 -16 24 0 z"/>
  <text class="t h2" x="86" y="406">Developer</text>

  <!-- 1 gh pr checkout -->
  <rect class="src" x="440" y="326" width="220" height="110" rx="12"/>
  <circle class="badge-src" cx="458" cy="346" r="10"/><text class="badge-t" x="458" y="350" text-anchor="middle">1</text>
  <text class="t h2" x="474" y="351">gh pr checkout</text>
  <line class="rule" x1="452" y1="366" x2="648" y2="366"/>
  <text class="c s" x="452" y="388">make checkout-pr PR=n</text>
  <text class="m s" x="452" y="418">requires a clean working tree</text>

  <!-- 2 Container build -->
  <rect class="src" x="700" y="326" width="220" height="110" rx="12"/>
  <circle class="badge-src" cx="718" cy="346" r="10"/><text class="badge-t" x="718" y="350" text-anchor="middle">2</text>
  <text class="t h2" x="734" y="351">Container build</text>
  <line class="rule" x1="712" y1="366" x2="908" y2="366"/>
  <text class="t b" x="712" y="388">podman by default</text>
  <text class="c s" x="712" y="418">--platform linux/amd64</text>

  <!-- 3 Container push -->
  <rect class="src" x="960" y="326" width="262" height="110" rx="12"/>
  <circle class="badge-src" cx="978" cy="346" r="10"/><text class="badge-t" x="978" y="350" text-anchor="middle">3</text>
  <text class="t h2" x="994" y="351">Container push</text>
  <line class="rule" x1="972" y1="366" x2="1210" y2="366"/>
  <text class="t b" x="972" y="388">engine logged in to the registry</text>

  <!-- 4 OpenShift Console -->
  <rect class="core" x="40" y="520" width="300" height="100" rx="12"/>
  <circle class="badge-core" cx="58" cy="540" r="10"/><text class="badge-t" x="58" y="544" text-anchor="middle">4</text>
  <text class="t h2" x="74" y="545">OpenShift Console</text>
  <line class="rule" x1="52" y1="560" x2="328" y2="560"/>
  <text class="t b" x="52" y="582">loads the plugin from the Service</text>

  <!-- 5 helm upgrade -->
  <rect class="src" x="700" y="520" width="220" height="100" rx="12"/>
  <circle class="badge-src" cx="718" cy="540" r="10"/><text class="badge-t" x="718" y="544" text-anchor="middle">5</text>
  <text class="t h2" x="734" y="545">helm upgrade --install</text>
  <line class="rule" x1="712" y1="560" x2="908" y2="560"/>
  <text class="c s" x="712" y="582">--take-ownership</text>
  <text class="c s" x="712" y="602">--set-string plugin.image</text>

  <!-- 6 Image registry -->
  <rect class="store" x="960" y="520" width="262" height="100" rx="12"/>
  <circle class="badge-store" cx="978" cy="540" r="10"/><text class="badge-t" x="978" y="544" text-anchor="middle">6</text>
  <text class="t h2" x="994" y="545">Image registry</text>
  <line class="rule" x1="972" y1="560" x2="1210" y2="560"/>
  <text class="c s" x="972" y="582">IMAGE=&lt;registry&gt;/&lt;name&gt;:&lt;tag&gt;</text>
  <text class="c s" x="972" y="602">deploy-pr: pr-N-quickstart:latest</text>

  <!-- ===== Cluster frame ===== -->
  <rect class="frame" x="24" y="660" width="1214" height="224" rx="14"/>
  <rect class="bg" x="380" y="650" width="300" height="20" rx="10"/>
  <text class="m lbl" x="392" y="664">OPENSHIFT CLUSTER · ONE NAMESPACE</text>

  <!-- 7 ConsolePlugin -->
  <rect class="core" x="40" y="682" width="264" height="170" rx="12"/>
  <circle class="badge-core" cx="58" cy="702" r="10"/><text class="badge-t" x="58" y="706" text-anchor="middle">7</text>
  <text class="t h2" x="74" y="707">ConsolePlugin</text>
  <line class="rule" x1="52" y1="722" x2="292" y2="722"/>
  <text class="t b" x="52" y="744">backend: the Service</text>
  <text class="c s" x="52" y="762">port 9443</text>
  <text class="m s" x="52" y="834">fixed cluster-scoped name</text>

  <!-- 8 Job -->
  <rect class="out" x="346" y="682" width="264" height="170" rx="12"/>
  <circle class="badge-out" cx="364" cy="702" r="10"/><text class="badge-t" x="364" y="706" text-anchor="middle">8</text>
  <text class="t h2" x="380" y="707">Job</text>
  <line class="rule" x1="358" y1="722" x2="598" y2="722"/>
  <text class="t b" x="358" y="744">post-install, post-upgrade hook</text>
  <text class="c s" x="358" y="762">oc patch cluster spec.plugins</text>
  <text class="c s" x="358" y="780">consoles.operator.openshift.io</text>
  <text class="m s" x="358" y="834">adds the plugin name to the list</text>

  <!-- 9 ConsoleQuickStart resources -->
  <rect class="store" x="652" y="682" width="264" height="170" rx="12"/>
  <circle class="badge-store" cx="670" cy="702" r="10"/><text class="badge-t" x="670" y="706" text-anchor="middle">9</text>
  <text class="t h2" x="686" y="707">ConsoleQuickStart resources</text>
  <line class="rule" x1="664" y1="722" x2="904" y2="722"/>
  <text class="t b" x="664" y="744">one per enabled values entry</text>
  <text class="c s" x="664" y="762">quickStarts.&lt;name&gt;.enabled</text>
  <text class="m s" x="664" y="834">cluster scoped</text>

  <!-- 10 Deployment and Service -->
  <rect class="out" x="958" y="682" width="264" height="170" rx="12"/>
  <circle class="badge-out" cx="976" cy="702" r="10"/><text class="badge-t" x="976" y="706" text-anchor="middle">10</text>
  <text class="t h2" x="992" y="707">Deployment and Service</text>
  <line class="rule" x1="970" y1="722" x2="1210" y2="722"/>
  <text class="t b" x="970" y="744">nginx serves dist/ over TLS</text>
  <text class="c s" x="970" y="762">port 9443</text>
  <text class="m s" x="970" y="834">serving cert via Service annotation</text>

  <text class="m s" x="40" y="872">Namespace and release name are console-demos-ocp-virtualization by default; NAMESPACE and RELEASE override them.</text>

  <!-- Edges -->
  <path class="flow" d="M220 401 H438" marker-end="url(#a-flow)"/>
  <text class="m s" x="228" y="378">make deploy-pr</text>
  <text class="m s" x="228" y="392">PR=n IMAGE_REGISTRY=r</text>
  <path class="flow" d="M130 433 V462 H810 V438" marker-end="url(#a-flow)"/>
  <text class="m s" x="300" y="480">make release IMAGE=i</text>
  <path class="flow" d="M660 401 H698" marker-end="url(#a-flow)"/>
  <path class="flow" d="M920 401 H958" marker-end="url(#a-flow)"/>
  <path class="flow" d="M1150 436 V518" marker-end="url(#a-flow)"/>
  <path class="flow" d="M980 436 V478 H830 V518" marker-end="url(#a-flow)"/>
  <path class="flow" d="M810 620 V658" marker-end="url(#a-flow)"/>
  <path class="ctl" d="M1091 620 V680" marker-end="url(#a-ctl)"/>
  <text class="m s" x="1099" y="654">image pull</text>
  <path class="ctl" d="M170 682 V622" marker-end="url(#a-ctl)"/>
  <text class="m s" x="178" y="640">loaded once the Job</text>
  <text class="m s" x="178" y="654">enables it</text>

  <!-- ===== Legend ===== -->
  <line class="rule" x1="40" y1="914" x2="1222" y2="914"/>
  <path class="flow" d="M40 942 H76" marker-end="url(#a-flow)"/>
  <text class="m s" x="86" y="946">command order</text>
  <path class="ctl" d="M200 942 H236" marker-end="url(#a-ctl)"/>
  <text class="m s" x="246" y="946">runtime path</text>
  <rect class="user" x="360" y="934" width="22" height="16" rx="4"/>
  <text class="m s" x="390" y="946">developer</text>
  <rect class="src" x="480" y="934" width="22" height="16" rx="4"/>
  <text class="m s" x="510" y="946">local tooling</text>
  <rect class="core" x="620" y="934" width="22" height="16" rx="4"/>
  <text class="m s" x="650" y="946">Console</text>
  <rect class="store" x="730" y="934" width="22" height="16" rx="4"/>
  <text class="m s" x="760" y="946">stored content</text>
  <rect class="out" x="880" y="934" width="22" height="16" rx="4"/>
  <text class="m s" x="910" y="946">cluster workload</text>
</svg>
