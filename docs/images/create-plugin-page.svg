<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1262 480" width="1262" height="480" role="img" aria-labelledby="title desc">
  <title id="title">Create a plugin page</title>
  <desc id="desc">Five pieces wired by name. 1: an optional navigation link, a console.navigation/href extension in console-extensions.json, whose href is the page URL. 2: the page URL, the route path a user opens. 3: the route, a console.page/route extension in console-extensions.json with a path and a $codeRef. 4: the exposed module under consolePlugin.exposedModules in package.json, whose key equals the route $codeRef. 5: the page component, a React function component at src/components/MyPage.tsx. Constraints: $codeRef must equal the exposedModules key in package.json; console-extensions.json changes require restarting yarn start; run yarn i18n after adding translated strings.</desc>

  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .frame { fill: #f6f8fa; stroke: #d0d7de; }
    .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { fill: #59636e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .c { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 24px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 650; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .b { font-size: 12px; }
    .s { font-size: 11px; }
    .k { font-weight: 650; }

    .src  { fill: #e6f6f4; stroke: #1f8f84; }
    .gate { fill: #fff4e0; stroke: #c27c0e; }
    .core { fill: #ecf2ff; stroke: #3b6fd8; }
    .out  { fill: #f3ecff; stroke: #7a4fd6; }
    .store{ fill: #eaf7ec; stroke: #2e8b46; }
    .deny { fill: #fdecec; stroke: #d1242f; }
    .user { fill: #f6f8fa; stroke: #6e7781; }

    /* badge fills are darker than card strokes so the white digit reaches 4.5:1 */
    .badge-src  { fill: #1c8278; }
    .badge-gate { fill: #a3680c; }
    .badge-core { fill: #3b6fd8; }
    .badge-out  { fill: #7a4fd6; }
    .badge-store{ fill: #2c8543; }
    .badge-t    { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }

    .flow  { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .ctl   { stroke: #6e7781; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .link  { stroke: #6e7781; stroke-width: 1.6; fill: none; }
    .rule  { stroke: #d0d7de; stroke-width: 1; }
    .ah-flow { fill: #57606a; }
    .ah-ctl  { fill: #6e7781; }
    .x { stroke: #d1242f; stroke-width: 2; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .frame { fill: #151b23; stroke: #30363d; }
      .t, .c { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .src  { fill: #0f2a28; stroke: #3fb8a9; }
      .gate { fill: #2e2310; stroke: #e3a33b; }
      .core { fill: #14213d; stroke: #6d9bff; }
      .out  { fill: #251a40; stroke: #a888ff; }
      .store{ fill: #112a19; stroke: #4cc06a; }
      .deny { fill: #3a1417; stroke: #ff6b6b; }
      .user { fill: #161b22; stroke: #6e7681; }
      .badge-src  { fill: #3fb8a9; }
      .badge-gate { fill: #e3a33b; }
      .badge-core { fill: #6d9bff; }
      .badge-out  { fill: #a888ff; }
      .badge-store{ fill: #4cc06a; }
      .badge-t    { fill: #0d1117; }
      .flow  { stroke: #8b949e; }
      .ctl   { stroke: #768390; }
      .link  { stroke: #768390; }
      .rule  { stroke: #30363d; }
      .ah-flow { fill: #8b949e; }
      .ah-ctl  { fill: #768390; }
      .x { stroke: #ff6b6b; }
    }
  </style>

  <defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-flow" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ctl" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Canvas -->
  <rect class="bg" x="0.5" y="0.5" width="1261" height="479" rx="16"/>

  <!-- Title -->
  <text class="t h1" x="40" y="46">Create a plugin page</text>
  <text class="m b" x="40" y="68">A navigation link, a route, an exposed module, and a React component, wired by name.</text>

  <!-- ===== Constraints band ===== -->
  <text class="m lbl" x="40" y="90">CONSTRAINTS</text>
  <rect class="frame" x="40" y="98" width="1182" height="124" rx="12"/>
  <text class="t b k" x="56" y="128">$codeRef</text>
  <text class="m b" x="220" y="128">must equal the exposedModules key in package.json</text>
  <line class="rule" x1="56" y1="142" x2="1206" y2="142"/>
  <text class="t b k" x="56" y="160">Extensions</text>
  <text class="m b" x="220" y="160">console-extensions.json changes require restarting yarn start</text>
  <line class="rule" x1="56" y1="174" x2="1206" y2="174"/>
  <text class="t b k" x="56" y="192">Translations</text>
  <text class="m b" x="220" y="192">run yarn i18n after adding translated strings</text>

  <!-- ===== Wiring ===== -->
  <text class="m lbl" x="40" y="254">WIRING · IN THE ORDER A USER REACHES THE PAGE</text>

  <!-- 1 Navigation link -->
  <rect class="gate" x="40" y="262" width="210" height="120" rx="12"/>
  <circle class="badge-gate" cx="58" cy="282" r="10"/><text class="badge-t" x="58" y="286" text-anchor="middle">1</text>
  <text class="t h2" x="74" y="287">Navigation link</text>
  <line class="rule" x1="52" y1="302" x2="238" y2="302"/>
  <text class="t b" x="52" y="324">Optional. href is the page URL</text>
  <text class="c s" x="52" y="342">console.navigation/href</text>
  <text class="c s" x="52" y="364">console-extensions.json</text>

  <!-- 2 Page URL -->
  <rect class="gate" x="276" y="262" width="150" height="120" rx="12"/>
  <circle class="badge-gate" cx="294" cy="282" r="10"/><text class="badge-t" x="294" y="286" text-anchor="middle">2</text>
  <text class="t h2" x="310" y="287">Page URL</text>
  <line class="rule" x1="288" y1="302" x2="414" y2="302"/>
  <text class="t b" x="288" y="324">The route path</text>
  <text class="t b" x="288" y="342">a user opens</text>

  <!-- 3 Route -->
  <rect class="gate" x="452" y="262" width="228" height="120" rx="12"/>
  <circle class="badge-gate" cx="470" cy="282" r="10"/><text class="badge-t" x="470" y="286" text-anchor="middle">3</text>
  <text class="t h2" x="486" y="287">Route</text>
  <line class="rule" x1="464" y1="302" x2="668" y2="302"/>
  <text class="t b" x="464" y="324">path and $codeRef</text>
  <text class="c s" x="464" y="342">console.page/route</text>
  <text class="c s" x="464" y="364">console-extensions.json</text>

  <!-- 4 Exposed module -->
  <rect class="src" x="706" y="262" width="260" height="120" rx="12"/>
  <circle class="badge-src" cx="724" cy="282" r="10"/><text class="badge-t" x="724" y="286" text-anchor="middle">4</text>
  <text class="t h2" x="740" y="287">Exposed module</text>
  <line class="rule" x1="718" y1="302" x2="954" y2="302"/>
  <text class="t b" x="718" y="324">Key equals the route $codeRef</text>
  <text class="c s" x="718" y="342">consolePlugin.exposedModules</text>
  <text class="c s" x="718" y="364">package.json</text>

  <!-- 5 Page component -->
  <rect class="core" x="992" y="262" width="230" height="120" rx="12"/>
  <circle class="badge-core" cx="1010" cy="282" r="10"/><text class="badge-t" x="1010" y="286" text-anchor="middle">5</text>
  <text class="t h2" x="1026" y="287">Page component</text>
  <line class="rule" x1="1004" y1="302" x2="1210" y2="302"/>
  <text class="t b" x="1004" y="324">React function component</text>
  <text class="c s" x="1004" y="364">src/components/MyPage.tsx</text>

  <!-- Edges: wiring order -->
  <path class="flow" d="M250 322 H274" marker-end="url(#a-flow)"/>
  <path class="flow" d="M426 322 H450" marker-end="url(#a-flow)"/>
  <path class="flow" d="M680 322 H704" marker-end="url(#a-flow)"/>
  <path class="flow" d="M966 322 H990" marker-end="url(#a-flow)"/>

  <!-- ===== Legend ===== -->
  <line class="rule" x1="40" y1="414" x2="1222" y2="414"/>
  <path class="flow" d="M40 442 H76" marker-end="url(#a-flow)"/>
  <text class="m s" x="86" y="446">resolves to</text>
  <rect class="gate" x="200" y="434" width="22" height="16" rx="4"/>
  <text class="m s" x="230" y="446">entry and routing</text>
  <rect class="src" x="360" y="434" width="22" height="16" rx="4"/>
  <text class="m s" x="390" y="446">definition</text>
  <rect class="core" x="490" y="434" width="22" height="16" rx="4"/>
  <text class="m s" x="520" y="446">plugin component</text>
</svg>
