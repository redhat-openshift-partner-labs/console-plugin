- heading: Overview
  level: 2
  content:
    - type: text
      value: >
        This tutorial demonstrates how to clone existing virtual machines in OpenShift Virtualization
        to rapidly deploy identical or customized VM instances. VM cloning creates copies of existing
        VMs with their entire disk contents, configurations, and installed software, enabling fast
        environment provisioning.

- heading: What is VM Cloning?
  level: 2
  content:
    - type: text
      value: >
        VM cloning creates a new virtual machine by duplicating an existing VM. OpenShift Virtualization
        provides two main methods for cloning.
    - type: steps
      items:
        - 'Web console cloning — Simple point-and-click interface for cloning VMs'
        - 'CLI-based cloning — Manual process of cloning PVCs and creating new VMs'
    - type: text
      value: 'Key benefits of VM cloning:'
    - type: steps
      items:
        - 'Rapid deployment of pre-configured environments'
        - 'Consistent software and configuration across instances'
        - 'Accelerated development and testing workflows'
        - 'Quick scale-out for identical workloads'
        - 'Reduced time from deployment to production-ready state'

- heading: Business Use Cases
  level: 2
  content:
    - type: text
      value: >
        Cloning is most valuable when you need a VM that is already configured, rather than
        one built from scratch.
    - type: steps
      items:
        - 'Environment provisioning — Clone a fully configured, production-like VM for QA testing'
        - 'Scale-out testing — Clone a web server VM multiple times to simulate load'
        - 'Cross-namespace deployment — Promote a validated VM from staging to production'
        - 'Disaster recovery testing — Clone production VMs into a DR namespace for failover testing'
        - 'Developer sandboxes — Give each developer a clone of a reference VM with tools pre-installed'

- heading: Prerequisites
  level: 2
  content:
    - type: text
      value: 'Before starting, ensure the following requirements are met:'
    - type: steps
      items:
        - 'OpenShift 4.18+ with OpenShift Virtualization operator installed'
        - 'Access to OpenShift web console or CLI tools: oc, virtctl'
        - 'Storage class that supports volume cloning'
        - 'At least one VM to clone from (or create one in this tutorial)'
        - 'Basic understanding of PersistentVolumeClaims (PVCs)'

- heading: 'Step 1: Create a Namespace and Source VM'
  level: 2
  content:
    - type: text
      value: >
        First, create a dedicated namespace for the cloning demonstration and deploy a source
        VM that will be cloned.
    - type: text
      value: 'Create the namespace:'
    - type: command
      value: oc create namespace vm-cloning-demo
      action: create-cloning-namespace
    - type: text
      value: >
        Deploy a source VM with nginx pre-installed. This VM will serve as the base for all clones
        in this tutorial.
    - type: note
      value: The cloud-init password in this example is for demo purposes only. Always use strong passwords or SSH key authentication in production.
      variant: warning
    - type: command
      value: '# Creates a Fedora VM with nginx pre-installed in vm-cloning-demo namespace'
      action: create-source-vm
    - type: text
      value: 'Wait for the VM to be running:'
    - type: command
      value: oc get vmi -n vm-cloning-demo

- heading: 'Step 2: Clone Using Web Console'
  level: 2
  content:
    - type: text
      value: >
        The web console provides the simplest method for cloning VMs. It automatically handles
        PVC cloning and creates a new VM with the cloned disk.
    - type: steps
      items:
        - 'Navigate to Virtualization → VirtualMachines'
        - 'Locate the VM you want to clone (source-webserver)'
        - 'Click the ⋮ (Actions menu) next to the VM'
        - 'Select Clone'
        - 'Enter a name for the new VM (e.g., webserver-clone-1)'
        - 'Optionally check "Start VirtualMachine once created" to start it immediately'
        - 'Review the configuration details (Operating system, CPU, Memory, NICs, Disks)'
        - 'Click Clone'
    - type: text
      value: >
        The web console will clone the source VM PVC, create a new VM with the cloned disk, and
        preserve the VM configuration. Monitor the clone progress in the VirtualMachines list.
    - type: text
      value: 'Verify the cloned VM status:'
    - type: command
      value: oc get vm -n vm-cloning-demo

- heading: 'Step 3: Clone Using CLI (DataVolume Method)'
  level: 2
  content:
    - type: text
      value: >
        For automation, customization, or cross-namespace cloning, use the CLI method. This is
        the recommended CLI approach.
    - type: text
      value: 'First, identify the source VM PVC:'
    - type: command
      value: oc get pvc -n vm-cloning-demo
    - type: text
      value: 'Create a standalone DataVolume that clones the source PVC:'
    - type: note
      value: The cdi.kubevirt.io/storage.bind.immediate.requested annotation is critical for storage classes that use WaitForFirstConsumer binding mode (like AWS EBS gp3-csi).
      variant: info
    - type: command
      value: '# Creates a DataVolume that clones the source VM PVC'
      action: create-clone-datavolume
    - type: text
      value: 'Monitor the clone progress:'
    - type: command
      value: oc get dv webserver-clone-2-disk -n vm-cloning-demo -w
    - type: text
      value: 'You will see phases like:'
    - type: steps
      items:
        - 'CloneFromSnapshotSourceInProgress — Using storage snapshots (fast)'
        - 'PrepClaimInProgress — Preparing the PVC'
        - 'RebindInProgress — Binding the volume'
        - 'Succeeded — Clone completed successfully'
    - type: text
      value: 'Once the DataVolume shows Succeeded, create a VM that uses the cloned disk:'
    - type: command
      value: '# Creates a VM using the cloned PVC'
      action: create-clone-vm
    - type: text
      value: 'Start the VM:'
    - type: command
      value: virtctl start webserver-clone-2 -n vm-cloning-demo

- heading: 'Step 4: Customize Clones with Cloud-init'
  level: 2
  content:
    - type: text
      value: >
        Cloned VMs inherit all data from the source, including hostname and credentials. Use
        cloud-init to customize clones with new hostnames, passwords, and configurations.
    - type: text
      value: >
        The customization example in CommandBlock creates a VM with cloud-init that sets a new
        hostname, updates the nginx welcome page, and preserves the nginx installation from the
        source VM.
    - type: text
      value: 'Key cloud-init configurations for clones:'
    - type: steps
      items:
        - 'hostname — Sets a new hostname for the cloned VM'
        - 'fqdn — Sets the fully qualified domain name'
        - 'manage_etc_hosts — Updates /etc/hosts with the new hostname'
        - 'password — Sets the password for the default user'
        - 'runcmd — Executes commands on first boot to customize the VM'

- heading: 'Step 5: Cross-Namespace Cloning'
  level: 2
  content:
    - type: text
      value: >
        Clone VMs to different namespaces for environment separation (dev, test, prod). This
        requires RBAC permissions for the target namespace to access PVCs in the source namespace.
    - type: text
      value: 'Create a target namespace:'
    - type: command
      value: oc create namespace vm-cloning-production
    - type: text
      value: >
        Configure RBAC by creating a Role in the source namespace that allows reading PVCs and
        DataVolumes, then bind it to the default service account in the target namespace.
    - type: note
      value: Cross-namespace cloning requires cluster permissions to create Roles and RoleBindings.
      variant: warning
    - type: text
      value: >
        Create a DataVolume in the production namespace that clones from the demo namespace by
        specifying the source PVC namespace in spec.source.pvc.namespace.
    - type: text
      value: 'Verify RBAC permissions:'
    - type: command
      value: 'oc auth can-i get pvc --as=system:serviceaccount:vm-cloning-production:default -n vm-cloning-demo'

- heading: Storage Considerations
  level: 2
  content:
    - type: text
      value: >
        Clone speed depends on your storage backend. Smart cloning uses CSI snapshots for fast
        cloning, while host-assisted cloning copies data through pods.
    - type: text
      value: 'Storage backends with smart cloning support:'
    - type: steps
      items:
        - 'Ceph RBD'
        - 'AWS EBS (gp3-csi)'
        - 'Azure Disk'
        - 'GCP Persistent Disk'
    - type: note
      value: Each clone requires full storage allocation equal to the source volume size. Plan capacity as (number of clones × source volume size).
      variant: info
    - type: text
      value: 'Check which cloning method is being used:'
    - type: command
      value: oc get dv <datavolume-name> -n <namespace> -o yaml | grep cloneType

- heading: Verification and Troubleshooting
  level: 2
  content:
    - type: text
      value: 'Common verification steps:'
    - type: steps
      items:
        - 'Check DataVolume status — Should show "Succeeded" when clone completes'
        - 'Check VM status — Should show "Running" when VM starts successfully'
        - 'Access VM console — Use virtctl console <vm-name> -n <namespace>'
        - 'Verify customizations — Check hostname, nginx status, and cloud-init logs'
    - type: text
      value: 'Common issues and solutions:'
    - type: steps
      items:
        - 'Clone stuck in "CloneInProgress" — Large volumes take time; check CDI pod logs'
        - 'Permission denied — Verify RBAC for cross-namespace cloning'
        - 'Same hostname as source — Add cloud-init configuration to set new hostname'
        - 'Storage quota exceeded — Check namespace quotas and increase if needed'
        - 'VM won''t start — Check PVC is bound and resources are available'

- heading: Cleanup
  level: 2
  content:
    - type: text
      value: >
        Remove all resources created in this tutorial to free up storage and compute resources.
    - type: note
      value: This will permanently delete all VMs and associated disks. Ensure you have backups if needed.
      variant: warning
    - type: command
      value: '# Deletes all VMs and DataVolumes in the vm-cloning-demo namespace'
      action: cleanup-cloning-demo
    - type: text
      value: 'Delete the namespaces:'
    - type: command
      value: oc delete namespace vm-cloning-demo
    - type: command
      value: oc delete namespace vm-cloning-production
    - type: text
      value: 'Verify cleanup:'
    - type: command
      value: oc get namespace | grep vm-cloning

- heading: Summary
  level: 2
  content:
    - type: text
      value: 'In this tutorial, you learned:'
    - type: steps
      items:
        - 'How VM cloning works in OpenShift Virtualization'
        - 'Business scenarios where cloning is the right approach'
        - 'How to clone VMs using the OpenShift web console'
        - 'How to clone VMs using CLI with standalone DataVolumes'
        - 'How to customize clones with cloud-init'
        - 'How to clone VMs across namespaces with RBAC'
        - 'Storage considerations: smart cloning vs host-assisted cloning'
        - 'Common troubleshooting techniques'
    - type: text
      value: >
        VM cloning accelerates development, testing, and deployment workflows by enabling rapid
        creation of pre-configured environments in OpenShift Virtualization.
