{{- if (index .Values.plugin.quickStarts "node-placement-affinity").enabled }}
apiVersion: console.openshift.io/v1
kind: ConsoleQuickStart
metadata:
  name: node-placement-affinity
  labels:
    {{- include "partner-labs-console-plugin.labels" . | nindent 4 }}
spec:
  displayName: "Control VM node placement and affinity"
  description: "Place VMs on selected nodes, keep related VMs together, and separate VMs for availability."
  durationMinutes: 25
  tags:
    - virtualization
    - scheduling
    - affinity
  prerequisites:
    - "OpenShift 4.19+ with OpenShift Virtualization installed"
    - "At least two Ready nodes labeled kubevirt.io/schedulable=true"
    - "Capacity for three VMs, each with 1 vCPU and 1 GiB of memory"
    - "Permission to list nodes and create and delete projects and VirtualMachines"
    - "An authenticated oc CLI and Bash; Run controls require the Web Terminal Operator"
    - "Cluster access to quay.io/containerdisks/fedora:latest"
  introduction: |-
    Control where virtual machines run by applying scheduling rules to their
    underlying `virt-launcher` pods. This walkthrough uses existing hostname
    labels, so it does not change node labels or require special hardware.

    You will:

    - Pin a VM to one node with a node selector.
    - Use required node affinity and preferred pod affinity to co-locate a VM.
    - Use required pod anti-affinity to place another VM on a different node.
    - Inspect placement and remove the temporary project.
  tasks:
    - title: "Prepare the placement project"
      description: |-
        List the nodes that OpenShift Virtualization can use and confirm that at
        least two show **Ready** in the **STATUS** column:

        `oc get nodes -l kubevirt.io/schedulable=true -L kubernetes.io/hostname`{{"{{execute}}"}}

        Create a dedicated project. Stop if it already exists so that earlier
        VMs cannot affect the affinity results:

        `oc create namespace vm-placement-demo`{{"{{execute}}"}}

        This walkthrough reads the built-in `kubernetes.io/hostname` label. It
        does not add, change, or remove node labels.
      review:
        instructions: "Are at least two VM-capable nodes Ready, and is vm-placement-demo new and empty?"
        failedTaskHelp: "Ask an administrator to check OpenShift Virtualization node placement, node readiness, and your permission to list nodes or create a project."
      summary:
        success: "The VM-capable nodes and dedicated project are ready."
        failed: "Prepare two Ready VM nodes and an empty project before continuing."

    - title: "Pin a VM with a node selector"
      description: |-
        Select the first Ready VM-capable node and create an anchor VM that
        requires its hostname label. The root disk is ephemeral and requires no
        StorageClass.

        ```
        TARGET_NODE=$(oc get nodes -l kubevirt.io/schedulable=true --no-headers | awk '$2 == "Ready" { print $1; exit }')
        test -n "${TARGET_NODE}"
        echo "Target node: ${TARGET_NODE}"

        oc create -n vm-placement-demo -f - <<YAML
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: placement-anchor
          labels:
            app.kubernetes.io/managed-by: partner-labs-console-plugin
        spec:
          runStrategy: Always
          template:
            metadata:
              labels:
                placement-demo: anchor
                app.kubernetes.io/managed-by: partner-labs-console-plugin
            spec:
              nodeSelector:
                kubernetes.io/hostname: "${TARGET_NODE}"
              domain:
                cpu:
                  cores: 1
                memory:
                  guest: 1Gi
                devices:
                  disks:
                    - name: rootdisk
                      disk:
                        bus: virtio
                  interfaces:
                    - name: default
                      masquerade: {}
              networks:
                - name: default
                  pod: {}
              volumes:
                - name: rootdisk
                  containerDisk:
                    image: quay.io/containerdisks/fedora:latest
        YAML
        ```{{"{{execute}}"}}

        Wait for the VM and verify its assigned node:

        `oc wait vm/placement-anchor -n vm-placement-demo --for=condition=Ready --timeout=300s`{{"{{execute}}"}}

        `oc get vmi placement-anchor -n vm-placement-demo -o custom-columns='NAME:.metadata.name,NODE:.status.nodeName,PHASE:.status.phase'`{{"{{execute}}"}}

        The reported node must equal the hostname selected by the command.
        Node selectors are hard constraints; a VM remains pending when no node
        has every requested label.
      review:
        instructions: "Is placement-anchor Running on the node selected by kubernetes.io/hostname?"
        failedTaskHelp: "Run `oc describe vmi placement-anchor -n vm-placement-demo` and check FailedScheduling events, node readiness, image access, and available compute capacity."
      summary:
        success: "The node selector pinned the anchor VM to the selected node."
        failed: "Resolve the selector or scheduling failure before continuing."

    - title: "Co-locate a VM with affinity"
      description: |-
        Create a second VM with two complementary rules. Required node affinity
        limits it to the anchor's hostname. Preferred pod affinity also gives a
        weight of 100 to the node that runs the anchor's launcher pod.

        ```
        TARGET_NODE=$(oc get vmi placement-anchor -n vm-placement-demo -o jsonpath='{.status.nodeName}')
        test -n "${TARGET_NODE}"

        oc create -n vm-placement-demo -f - <<YAML
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: affinity-vm
          labels:
            app.kubernetes.io/managed-by: partner-labs-console-plugin
        spec:
          runStrategy: Always
          template:
            metadata:
              labels:
                placement-demo: colocated
                app.kubernetes.io/managed-by: partner-labs-console-plugin
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - key: kubernetes.io/hostname
                            operator: In
                            values:
                              - "${TARGET_NODE}"
                podAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        labelSelector:
                          matchLabels:
                            placement-demo: anchor
                        topologyKey: kubernetes.io/hostname
              domain:
                cpu:
                  cores: 1
                memory:
                  guest: 1Gi
                devices:
                  disks:
                    - name: rootdisk
                      disk:
                        bus: virtio
                  interfaces:
                    - name: default
                      masquerade: {}
              networks:
                - name: default
                  pod: {}
              volumes:
                - name: rootdisk
                  containerDisk:
                    image: quay.io/containerdisks/fedora:latest
        YAML
        ```{{"{{execute}}"}}

        Wait for the second VM and compare node assignments:

        `oc wait vm/affinity-vm -n vm-placement-demo --for=condition=Ready --timeout=300s`{{"{{execute}}"}}

        `oc get vmi placement-anchor affinity-vm -n vm-placement-demo -o custom-columns='NAME:.metadata.name,NODE:.status.nodeName,PHASE:.status.phase'`{{"{{execute}}"}}

        Both VMs must report the same node. Required rules are hard constraints;
        preferred rules influence scheduling but can be ignored when necessary.
      review:
        instructions: "Are placement-anchor and affinity-vm Running on the same node?"
        failedTaskHelp: "Inspect `oc describe vmi affinity-vm -n vm-placement-demo`. Confirm the anchor is Running, the hostname value exists, and the required affinity expression is under spec.template.spec."
      summary:
        success: "Node and pod affinity placed both VMs on the same node."
        failed: "Correct the affinity rule or scheduling constraint before continuing."

    - title: "Separate a VM with anti-affinity"
      description: |-
        Create a third VM with required pod anti-affinity. The label selector
        matches the anchor's launcher pod, and the hostname topology requires a
        different node.

        ```
        oc create -n vm-placement-demo -f - <<'YAML'
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: anti-affinity-vm
          labels:
            app.kubernetes.io/managed-by: partner-labs-console-plugin
        spec:
          runStrategy: Always
          template:
            metadata:
              labels:
                placement-demo: separated
                app.kubernetes.io/managed-by: partner-labs-console-plugin
            spec:
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - labelSelector:
                        matchLabels:
                          placement-demo: anchor
                      topologyKey: kubernetes.io/hostname
              domain:
                cpu:
                  cores: 1
                memory:
                  guest: 1Gi
                devices:
                  disks:
                    - name: rootdisk
                      disk:
                        bus: virtio
                  interfaces:
                    - name: default
                      masquerade: {}
              networks:
                - name: default
                  pod: {}
              volumes:
                - name: rootdisk
                  containerDisk:
                    image: quay.io/containerdisks/fedora:latest
        YAML
        ```{{"{{execute}}"}}

        Wait for the VM and compare all three placements:

        `oc wait vm/anti-affinity-vm -n vm-placement-demo --for=condition=Ready --timeout=300s`{{"{{execute}}"}}

        `oc get vmi -n vm-placement-demo -o custom-columns='NAME:.metadata.name,NODE:.status.nodeName,PHASE:.status.phase'`{{"{{execute}}"}}

        `anti-affinity-vm` must run on a different node from `placement-anchor`.
        The affinity pair remains together on the original node.
      review:
        instructions: "Is anti-affinity-vm Running on a different node from placement-anchor?"
        failedTaskHelp: "Check for a second Ready VM-capable node with available capacity. Inspect `oc describe vmi anti-affinity-vm -n vm-placement-demo` and verify the selector matches the anchor's template label."
      summary:
        success: "Required anti-affinity separated the third VM from the anchor."
        failed: "Resolve node capacity or anti-affinity matching before continuing."

    - title: "Inspect and troubleshoot placement"
      description: |-
        In the web console, go to **Virtualization > VirtualMachines** and select
        **vm-placement-demo**. Open each VM and review its node on the
        **Overview** tab. Under **Configuration > Scheduling**, inspect the node
        selector or affinity rules.

        Use the CLI to display the effective placement configuration:

        `oc get vm placement-anchor -n vm-placement-demo -o jsonpath='{.spec.template.spec.nodeSelector}{"\n"}'`{{"{{execute}}"}}

        `oc get vm affinity-vm -n vm-placement-demo -o jsonpath='{.spec.template.spec.affinity}{"\n"}'`{{"{{execute}}"}}

        `oc get vm anti-affinity-vm -n vm-placement-demo -o jsonpath='{.spec.template.spec.affinity}{"\n"}'`{{"{{execute}}"}}

        If a VM is pending, inspect its events:

        `oc get events -n vm-placement-demo --field-selector=reason=FailedScheduling --sort-by=.lastTimestamp`{{"{{execute}}"}}

        Common causes are a label mismatch, rules at the wrong YAML level,
        insufficient node capacity, node taints, or too few topology domains.
        Affinity rules apply when the VMI is scheduled; changing node labels
        later does not automatically move a running VM.
      review:
        instructions: "Can you identify each VM's placement rule and node in both the console and CLI output?"
        failedTaskHelp: "Confirm placement fields are under spec.template.spec, compare label selectors with template labels, and review FailedScheduling events."
      summary:
        success: "You inspected the placement rules and their scheduling results."
        failed: "Review the VM specifications, node labels, and scheduler events."

    - title: "Clean up the placement demo"
      description: |-
        Review the disposable resources:

        `oc get vm,vmi -n vm-placement-demo -o wide`{{"{{execute}}"}}

        Delete the dedicated project and all three ephemeral VMs:

        `oc delete namespace vm-placement-demo`{{"{{execute}}"}}

        Verify deletion:

        `oc get namespace vm-placement-demo`{{"{{execute}}"}}

        Expect a `NotFound` response. No node labels, PVCs, or persistent
        volumes were created by this walkthrough.
      review:
        instructions: "Did vm-placement-demo finish deleting?"
        failedTaskHelp: "Run `oc get namespace vm-placement-demo` until it returns NotFound. Delete only this dedicated demo project."
      summary:
        success: "The project and all placement demo VMs were removed."
        failed: "Wait for the dedicated project to finish deleting."
  conclusion: |-
    You used a node selector, required and preferred affinity, and required
    anti-affinity to control VM placement without changing cluster node labels.
    Continue with the published [Node Placement and Affinity cookbook tutorial](https://redhatquickcourses.github.io/ocp-virt-cookbook/ocp-virt-cookbook/1/vm-configuration/node-placement-affinity.html)
    for additional placement patterns and troubleshooting guidance.
  nextQuickStart: []
{{- end }}
